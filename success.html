<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Success</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Success Animation */
        .check-circle {
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .dot {
            animation: pop 0.4s ease-out forwards;
            opacity: 0;
        }

        .dot-1 {
            animation-delay: 0.2s;
        }

        .dot-2 {
            animation-delay: 0.3s;
        }

        .dot-3 {
            animation-delay: 0.4s;
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes pop {
            0% {
                transform: scale(0) translate(0, 0);
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                transform: scale(1) translate(var(--tx), var(--ty));
                opacity: 1;
            }
        }
    </style>
</head>

<body class="bg-[#f5f6f8] h-screen flex flex-col items-center pt-24 px-6 relative overflow-hidden">

    <!-- Animated Icon -->
    <div class="relative mb-6 mt-8">
        <div
            class="w-24 h-24 bg-[#42d250] rounded-full flex items-center justify-center check-circle shadow-lg shadow-green-200">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round" class="check-circle">
                <path d="M5 13l4 4L19 7" />
            </svg>
        </div>
        <div class="absolute w-3 h-3 bg-[#42d250] rounded-full dot dot-1"
            style="top: -10px; left: -10px; --tx: -20px; --ty: -20px;"></div>
        <div class="absolute w-2 h-2 bg-[#42d250] rounded-full dot dot-2"
            style="bottom: 10px; right: -20px; --tx: 30px; --ty: 10px;"></div>
        <div class="absolute w-4 h-4 bg-[#42d250] rounded-full dot dot-3"
            style="top: 20px; right: -10px; --tx: 25px; --ty: -15px;"></div>
    </div>

    <h1 class="text-2xl font-bold text-gray-900 mb-2">Påfylling vellykket!</h1>
    <p class="text-[15px] text-gray-500 text-center mb-1">Du har fylt på <span id="success-coins"
            class="font-medium">0</span> mynter</p>
    <p class="text-[13px] text-gray-400 mb-10">Tidspunkt: <span id="success-time"
            class="text-green-600 font-medium"></span></p>

    <!-- Details Card -->
    <div class="w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-5 flex items-center mb-10">
        <div class="w-10 h-10 bg-black rounded-lg flex items-center justify-center mr-3 shrink-0">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                <path
                    d="M19.589 6.686a4.793 4.793 0 01-3.77-4.245V2h-3.445v13.672a2.896 2.896 0 01-5.201 1.743l-.002-.001.002.001a2.895 2.895 0 013.183-4.51v-3.5a6.329 6.329 0 00-5.394 10.692 6.33 6.33 0 0010.857-4.424V8.687a8.182 8.182 0 004.773 1.526V6.79a4.831 4.831 0 01-1.003-.104z" />
            </svg>
        </div>

        <div class="flex-1">
            <div class="text-[11px] text-gray-500 mb-0.5">Konto:</div>
            <div id="success-username" class="text-[15px] font-medium text-gray-900 truncate w-32"></div>
        </div>

        <!-- <div class="w-px h-10 bg-gray-200 mx-4"></div> -->

        <div class="text-right flex-1">
            <div class="text-[11px] text-gray-500 mb-0.5">Betalingsbeløp:</div>
            <div class="text-[18px] font-bold text-gray-900 tracking-tight">$<span id="success-amount">0.00</span>
            </div>
        </div>
    </div>

    <button onclick="window.location.href='index.html'"
        class="w-full bg-[#007aff] hover:bg-blue-600 active:bg-blue-700 transition-colors text-white py-3.5 rounded-xl font-semibold text-[16px] shadow-sm">
        Fullfør
    </button>

    <div class="absolute bottom-6 text-gray-300 opacity-50 font-bold text-xl tracking-widest pointer-events-none">
        TikTok
    </div>

    <script>
        function formatMoney(amount) {
            return new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);
        }

        window.onload = () => {
            const coins = sessionStorage.getItem('last_tx_coins') || '0';
            const usd = parseFloat(sessionStorage.getItem('last_tx_usd') || '0');
            const user = sessionStorage.getItem('last_tx_user') || 'N/A';

            document.getElementById('success-coins').innerText = new Intl.NumberFormat('en-US').format(coins);
            document.getElementById('success-amount').innerText = formatMoney(usd);
            document.getElementById('success-username').innerText = user;

            // EST Time formatting
            const date = new Date();
            const options = { timeZone: 'America/New_York', hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' };
            const estString = date.toLocaleString('en-US', options);
            const [datePart, timePart] = estString.split(', ');
            const [month, day, year] = datePart.split('/');
            document.getElementById('success-time').innerText = `${year}.${month}.${day} ${timePart}`;
        };
    </script>
</body>

</html>
