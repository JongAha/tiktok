<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Success</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .animate-check {
            animation: scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="flex flex-col h-screen overflow-hidden">

    <div class="flex-1 overflow-y-auto w-full flex flex-col items-center pt-16">

        <!-- Checkmark Icon -->
        <div
            class="w-[72px] h-[72px] bg-[#1ed961] rounded-full flex items-center justify-center animate-check mb-5 shadow-sm">
            <svg class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 13l4 4L19 7" />
            </svg>
        </div>

        <!-- Title & Subtitle -->
        <h1 class="text-[22px] font-semibold text-gray-900 mb-1.5 tracking-tight">Veksling fullført!</h1>
        <div class="flex items-center text-[15px] text-gray-500 mb-8">
            Du vekslet til <img src="tiktok_coin.png" class="w-[18px] h-[18px] mx-1.5 object-contain" alt="coin"> <span
                id="header-coins" class="font-medium text-gray-700">0</span>&nbsp;mynter
        </div>

        <div class="w-full flex flex-col border-t border-gray-100">
            <!-- Row: Recipient -->
            <div class="flex justify-between items-center py-4 px-5 border-b border-gray-100">
                <span class="text-[15px] text-gray-600">Mottaker</span>
                <span id="row-recipient" class="text-[15px] font-medium text-gray-900">@brukernavn</span>
            </div>

            <!-- Row: Coins Exchanged -->
            <div class="flex justify-between items-center py-4 px-5 border-b border-gray-100">
                <span class="text-[15px] text-gray-600">Mynter vekslet</span>
                <span id="row-coins" class="text-[15px] font-medium text-gray-900">0 mynter</span>
            </div>

            <!-- Row: Deducted Amount -->
            <div class="flex justify-between items-center py-4 px-5 border-b border-gray-100">
                <span class="text-[15px] text-gray-600">Trukket beløp</span>
                <span id="row-usd" class="text-[15px] font-medium text-gray-900">$0.00</span>
            </div>

            <!-- Row: Time -->
            <div class="flex justify-between items-center py-4 px-5 border-b border-gray-100">
                <span class="text-[15px] text-gray-600">Tidspunkt</span>
                <span id="row-time" class="text-[14px] font-medium text-gray-900">N/A</span>
            </div>
        </div>

        <div class="w-full px-5 mt-6">
            <div class="bg-gray-50/80 border border-gray-100 rounded-2xl p-4 flex items-start gap-3.5">
                <!-- TikTok Icon Box -->
                <div class="w-[42px] h-[42px] bg-[#111111] rounded-xl flex items-center justify-center shrink-0">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
                        <path
                            d="M19.589 6.686a4.793 4.793 0 01-3.77-4.245V2h-3.445v13.672a2.896 2.896 0 01-5.201 1.743l-.002-.001.002.001a2.895 2.895 0 013.183-4.51v-3.5a6.329 6.329 0 00-5.394 10.692 6.33 6.33 0 0010.857-4.424V8.687a8.182 8.182 0 004.773 1.526V6.79a4.831 4.831 0 01-1.003-.104z" />
                    </svg>
                </div>
                <!-- Banner Text -->
                <div class="flex flex-col">
                    <span class="text-[15px] font-semibold text-gray-900 mb-0.5">Start gifter-nivå</span>
                    <p class="text-[13px] text-gray-500 leading-snug">Send din første gave for å starte gifter-reisen
                        din og låse opp flere belønninger etter hvert som du går opp i nivå.</p>
                </div>
            </div>
        </div>

        <div class="h-8 w-full"></div> <!-- Extra scroll space -->
    </div>

    <div class="w-full px-5 pb-8 pt-3 bg-white shrink-0">
        <button onclick="window.location.href='index.html'"
            class="w-full bg-[#1ed961] active:bg-[#1bb853] transition-colors text-white py-3.5 rounded-xl text-[16px] font-medium flex items-center justify-center gap-1.5 shadow-sm">
            Gå tilbake
        </button>
    </div>

    <script>
        window.onload = () => {
            // Retrieve stored data from previous page (exchange.html)
            const coins = sessionStorage.getItem('last_tx_coins') || '0';
            const usd = parseFloat(sessionStorage.getItem('last_tx_usd') || '0');
            const user = sessionStorage.getItem('last_tx_user') || 'N/A';

            // Format numbers
            const formattedCoins = new Intl.NumberFormat('en-US').format(coins);
            const formattedUsd = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(usd);

            // Populate text elements
            document.getElementById('header-coins').innerText = formattedCoins;
            document.getElementById('row-recipient').innerText = user.startsWith('@') ? user : '@' + user;
            document.getElementById('row-coins').innerText = `${formattedCoins} mynter`;
            document.getElementById('row-usd').innerText = `$${formattedUsd}`;

            // Generate localized timestamp identical to the required format (e.g., 9/5/2026, 4:50:09 PM)
            const date = new Date();
            const timeString = date.toLocaleString('en-US', {
                month: 'numeric',
                day: 'numeric',
                year: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });

            document.getElementById('row-time').innerText = timeString;
        };
    </script>
</body>

</html>
